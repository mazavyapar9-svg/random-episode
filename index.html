<!DOCTYPE html>
<html>
<head>
  <title>Random Looney Tunes Episode</title>
</head>
<body>
  <a href="#" onclick="playRandomEpisode()">🎬 Play Random Episode</a>

  <script>
    function playRandomEpisode() {
      // Add all episode URLs here
      const episodes = [
        "https://www.topcartoons.tv/serie/looney-tunes/episode-1",
        "https://www.topcartoons.tv/serie/looney-tunes/episode-2",
        "https://www.topcartoons.tv/serie/looney-tunes/episode-3",
        "https://www.topcartoons.tv/serie/looney-tunes/episode-4"
        // keep adding more...
      ];

      // Pick a random one
      const randomIndex = Math.floor(Math.random() * episodes.length);
      const randomEpisode = episodes[randomIndex];

      // Redirect to it
      window.location.href = randomEpisode;
    }
  </script>
</body>
</html>
